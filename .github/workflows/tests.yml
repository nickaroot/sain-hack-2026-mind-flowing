# Тесты на каждый push и pull request. Сети и ключей им не нужно: нейросеть и сервис хакатона подменяются.
# Деплой на стенд (deploy.yml) от этого прогона не зависит: перед сроком сдачи он не должен ждать очереди.
name: Тесты

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
