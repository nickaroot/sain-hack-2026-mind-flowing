[project]
name = "mindflowing-case4"
version = "1.0.0"
description = "Серверная часть кейса 4 «Эксперт как плейлист»: ответы трёх экспертов о сне по базе научных статей"
requires-python = ">=3.11"

# Зависимости стенд ставит из requirements.txt; здесь только настройки инструментов разработки.

[tool.pytest.ini_options]
# Корень репозитория в пути поиска модулей: команда pytest из README работает из любого окружения.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001–003 считают кириллицу «двусмысленными символами»: комментарии и тексты здесь на русском.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]  # тексты инструкций для нейросети: переносы строк — часть текста

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
